name: Capture PR 31 screenshots

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homi_test
          POSTGRES_USER: homi
          POSTGRES_PASSWORD: homi-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homi -d homi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://homi:homi-test@127.0.0.1:5432/homi_test
      TEST_DATABASE_URL: postgresql://homi:homi-test@127.0.0.1:5432/homi_test
      BETTER_AUTH_SECRET: screenshot-only-secret-with-at-least-thirty-two-characters
      CRON_SECRET: screenshot-only-cron-secret-long-enough
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: ./data/test-uploads
      CLAMAV_ENABLED: "false"
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: ""
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bunx playwright install --with-deps chromium
      - name: Start Homi
        run: |
          nohup bun run dev > /tmp/homi-screenshots.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/homi-screenshots.log
          exit 1
      - name: Capture screenshots
        run: node scripts/capture-pr31-screenshots.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pr31-ui-screenshots
          path: artifacts/pr31-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/homi-screenshots.log || true
