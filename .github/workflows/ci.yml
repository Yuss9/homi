name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homi_test
          POSTGRES_USER: homi
          POSTGRES_PASSWORD: homi-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homi -d homi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      smtp:
        image: mailhog/mailhog:v1.0.1
        ports: ["1025:1025"]
    env:
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://homi:homi-test@127.0.0.1:5432/homi_test
      TEST_DATABASE_URL: postgresql://homi:homi-test@127.0.0.1:5432/homi_test
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      CRON_SECRET: ci-only-cron-secret-long-enough
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: ./data/test-uploads
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.13 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:integration
      - run: bun run build
      - run: docker build -t homi:ci .
      - run: bunx playwright install --with-deps chromium
      - run: bun run db:seed
      - run: bun run test:e2e --project=desktop
