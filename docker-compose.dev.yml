name: homi-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homi
      POSTGRES_USER: homi
      POSTGRES_PASSWORD: homi-local-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: [homi_dev_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homi -d homi"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: homi-minio
      MINIO_ROOT_PASSWORD: homi-minio-local-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [homi_dev_minio:/data]
volumes:
  homi_dev_postgres:
  homi_dev_minio:

