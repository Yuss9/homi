name: homi
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [homi_internal]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file: .env
    volumes:
      - minio_data:/data
    networks: [homi_internal]
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    env_file: .env
    depends_on:
      minio: { condition: service_healthy }
    networks: [homi_internal]
    entrypoint: >
      /bin/sh -c "
      mc alias set homi http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing homi/\"$$S3_BUCKET\" &&
      mc anonymous set none homi/\"$$S3_BUCKET\"
      "

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    networks: [homi_internal]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [homi_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ${HOMI_IMAGE:-homi:local}
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - uploads_data:/app/data/uploads
    networks: [homi_internal]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 10

  reminders:
    image: curlimages/curl:8.14.1
    restart: unless-stopped
    env_file: .env
    depends_on:
      web: { condition: service_healthy }
    networks: [homi_internal]
    command: >
      sh -c 'while true; do
      curl --fail --silent --show-error
      -X POST -H "Authorization: Bearer $$CRON_SECRET"
      http://web:3000/api/internal/reminders || true;
      sleep 3600;
      done'

networks:
  homi_internal:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
  uploads_data:
